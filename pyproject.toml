[project]
name = "fastgrpc3"
version = "0.1.1"
description = "FastAPI-like gRPC framework for Python: contracts from .proto files or Pydantic models, powered by protoruf (Rust)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "William Nauroy", email = "william.nauroy@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["grpc", "protobuf", "pydantic", "asyncio", "fastapi", "rpc", "rust", "tonic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # First release shipping CPython 3.14 wheels.
    "grpcio>=1.75.1",
    "protoruf>=0.5.3",
    # `model_validate(..., by_name=True)` appeared in 2.11.
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/EdwinAlkins/fastgrpc3"
Documentation = "https://edwinalkins.github.io/fastgrpc3/"
Repository = "https://github.com/EdwinAlkins/fastgrpc3"
Changelog = "https://github.com/EdwinAlkins/fastgrpc3/blob/main/CHANGELOG.md"
Issues = "https://github.com/EdwinAlkins/fastgrpc3/issues"

[project.scripts]
fastgrpc3 = "fastgrpc3.cli:main"

[project.optional-dependencies]
docs = [
    "uvicorn>=0.30",
]
# The tonic transport (`GrpcApp(transport="tonic")`), a Rust server.
tonic = [
    "fastgrpc3-transport>=0.1,<0.2",
]

[dependency-groups]
bench = [
    "fastgrpc2==0.5.0",
    "protobuf>=7.36.2",
]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-grpcio>=1.85.0.20261028",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by scripts/generate_standard_protos.py (proto comments make long lines).
extend-exclude = ["src/fastgrpc3/_proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# `x: Repo = Depends(get_repo)` is the documented way to declare a dependency.
extend-immutable-calls = ["fastgrpc3.Depends", "fastgrpc3.api.deps.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# The tonic transport, optional (`fastgrpc3-transport`, typed when installed).
module = ["fastgrpc3_transport"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Returns what the extension gives, typed only when fastgrpc3-transport is installed.
module = ["fastgrpc3.transport.tonic"]
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
