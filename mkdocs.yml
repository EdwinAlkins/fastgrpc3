site_name: fastgrpc3
site_description: A FastAPI-like gRPC framework for Python, powered by protoruf

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# The docs environment lives in docs/ too (see docs/pyproject.toml).
exclude_docs: |
  pyproject.toml
  uv.lock

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Contracts (code first): contracts.md
      - Proto first: proto-first.md
      - Server: server.md
      - Client: client.md
      - Testing: testing.md
  - Reference:
      - Type mapping: types.md
      - Command line: cli.md
  - Performance: performance.md
  - Coming from fastgrpc2: fastgrpc2.md

strict: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
